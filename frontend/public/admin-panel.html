<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Panel de Administración</title>
    <link rel="icon" href="assets/img/logos/logo-menta.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #00FFFF;
            /* Cian Neón */
            --dark-bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            /* Fondo sólido y suave */
            min-height: 100vh;
            padding: 20px;
            color: #eafcff;
            /* Texto claro global */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(12, 16, 20, 0.55);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 26px rgba(0, 255, 255, 0.2), 0 22px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .header {
            background: linear-gradient(135deg, rgba(0, 201, 255, 0.95) 0%, rgba(146, 254, 157, 0.85) 100%);
            color: #041014;
            padding: 32px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 -6px 20px rgba(255, 255, 255, 0.15), 0 6px 18px rgba(0, 201, 255, 0.28);
        }

        .admin-logo {
            display: block;
            margin: 0 auto 15px auto;
            max-height: 140px;
            /* Tamaño aumentado */
            width: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            image-rendering: -webkit-optimize-contrast;
            /* Mejora la nitidez en algunos navegadores */
            transition: transform 0.3s ease;
        }

        .admin-logo:hover {
            transform: scale(1.05);
            /* Efecto interactivo sutil */
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            background: rgba(10, 14, 18, 0.6);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.06);
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            color: #eafcff;
        }

        .tab.active {
            background: rgba(0, 255, 255, 0.08);
            border-bottom: 3px solid #00c9ff;
            color: #00c9ff;
            box-shadow: 0 2px 12px rgba(0, 255, 255, 0.18);
        }

        .tab-content {
            padding: 30px;
            min-height: 500px;
            background: linear-gradient(180deg, rgba(2, 8, 10, 0.35), rgba(2, 8, 10, 0.15));
            color: #eafcff;
        }

        /* Neon/Glass style for Accounting panel */
        #accounting-container {
            background: rgba(12, 16, 20, 0.65);
            border: 1px solid rgba(0, 255, 255, 0.18);
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.22), inset 0 0 8px rgba(255, 255, 255, 0.06);
            color: #0a0a0a;
            backdrop-filter: blur(8px);
            padding: 16px;
        }

        #accounting-container table {
            color: #0a0a0a;
        }

        #accounting-container thead tr {
            background: rgba(15, 23, 42, 0.65) !important;
        }

        #accounting-container th {
            color: #0a0a0a;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        #accounting-container td {
            color: #0a0a0a;
        }

        /* Neon styling for accounting filters */
        #accounting input[type="date"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 10px;
            color: #0a0a0a;
            padding: 8px 10px;
        }

        #accounting input[type="date"]::placeholder {
            color: rgba(10, 10, 10, 0.55);
        }

        #accounting input[type="date"]:focus {
            outline: none;
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 8px;
            }

            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .admin-logo {
                max-height: 50px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab {
                flex: 1 1 50%;
                font-size: 14px;
                padding: 12px 10px;
            }

            .tab-content {
                padding: 15px;
            }

            /* Responsive Tables */
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                margin-bottom: 20px;
                border-radius: 8px;
                border: 1px solid rgba(0, 255, 255, 0.1);
            }

            table {
                min-width: 600px;
                /* Force scroll on small screens */
            }

            /* Filters */
            .filters {
                flex-direction: column;
                gap: 12px !important;
            }

            .filters>div {
                width: 100%;
                justify-content: space-between;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
                margin: 10px;
            }
        }

        @media (max-width: 480px) {
            .tab {
                flex: 1 1 100%;
                text-align: left;
                border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            }

            .tab.active {
                border-bottom: 2px solid #00c9ff;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* PROFESSIONAL SCAN ALERTS */
        .scan-alert {
            margin-top: 25px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            animation: alertSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid transparent;
            backdrop-filter: blur(10px);
        }

        @keyframes alertSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .scan-alert i {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            animation: iconPop 0.6s 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
        }

        @keyframes iconPop {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .scan-alert h3 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scan-alert-valid {
            background: rgba(0, 255, 128, 0.1);
            border-color: #00ff80;
            color: #00ff80;
            box-shadow: 0 0 25px rgba(0, 255, 128, 0.25);
        }

        .scan-alert-valid i {
            color: #00ff80;
            text-shadow: 0 0 20px rgba(0, 255, 128, 0.6);
        }

        .scan-alert-used {
            background: rgba(255, 179, 0, 0.1);
            border-color: #ffb300;
            color: #ffb300;
            box-shadow: 0 0 25px rgba(255, 179, 0, 0.25);
        }

        .scan-alert-used i {
            color: #ffb300;
            text-shadow: 0 0 20px rgba(255, 179, 0, 0.6);
        }

        .scan-alert-invalid {
            background: rgba(255, 51, 51, 0.1);
            border-color: #ff3333;
            color: #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.25);
        }

        .scan-alert-invalid i {
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
        }

        .scan-details {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            display: inline-block;
            text-align: left;
            min-width: 250px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scan-details p {
            margin: 5px 0;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .cooldown-progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .cooldown-progress-bar {
            height: 100%;
            width: 100%;
            background: currentColor;
            transition: width 1s linear;
        }

        .order-card {
            background: rgba(12, 16, 20, 0.6);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 16px rgba(0, 255, 255, 0.18), inset 0 0 8px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            color: #eafcff;
        }

        .order-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 255, 255, 0.35);
            box-shadow: 0 0 22px rgba(0, 255, 255, 0.28), inset 0 0 10px rgba(255, 255, 255, 0.08);
        }

        .order-card.confirmed {
            border-left-color: #28a745;
        }

        .order-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: bold;
            font-size: 1.2em;
            color: #495057;
        }

        .order-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            background: rgba(0, 255, 255, 0.06);
            color: var(--primary-color);
            border: 1px solid rgba(0, 255, 255, 0.45);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            transform: translateY(-1px);
            background: rgba(0, 255, 255, 0.12);
            box-shadow: 0 0 14px rgba(0, 255, 255, 0.35);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.95), rgba(0, 255, 255, 0.75));
            color: #0a0a0a;
            border: 1px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.35), inset 0 0 6px rgba(255, 255, 255, 0.25);
        }

        /* Force neon style on top action buttons */
        #logout-btn,
        #home-btn {
            background: rgba(0, 255, 255, 0.08) !important;
            color: var(--primary-color) !important;
            border: 1px solid rgba(0, 255, 255, 0.55) !important;
            padding: 10px 18px !important;
            font-size: 1rem !important;
            border-radius: 12px !important;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.25), inset 0 0 8px rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(6px) !important;
        }

        #logout-btn:hover,
        #home-btn:hover {
            background: rgba(0, 255, 255, 0.14) !important;
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.45), inset 0 0 10px rgba(255, 255, 255, 0.25) !important;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(0, 255, 255, 1), rgba(0, 255, 255, 0.85));
            box-shadow: 0 0 16px rgba(0, 255, 255, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.95), rgba(34, 197, 94, 0.75));
            color: #0a0a0a;
            border: 1px solid rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.35), inset 0 0 6px rgba(255, 255, 255, 0.2);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, rgba(34, 197, 94, 1), rgba(34, 197, 94, 0.85));
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.5);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .qr-container {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 10px 0;
        }

        .qr-code {
            max-width: 200px;
            margin: 10px auto;
        }

        .ticket-info {
            background: rgba(12, 16, 20, 0.6);
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 14px rgba(0, 255, 255, 0.16), inset 0 0 6px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            color: #eafcff;
        }

        .ticket-info:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 255, 255, 0.32);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.26);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.85) 0%, rgba(118, 75, 162, 0.85) 100%);
            color: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 18px rgba(0, 255, 255, 0.18), inset 0 0 8px rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 255, 255, 0.32);
            box-shadow: 0 0 24px rgba(0, 255, 255, 0.28);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 5000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Neon/Glass style for Order Edit modal */
        #edit-order-modal .modal-content {
            background: rgba(12, 16, 20, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 12px rgba(255, 255, 255, 0.08);
            color: #eafcff;
            backdrop-filter: blur(12px);
            max-width: 600px;
        }

        #edit-order-modal .close {
            color: var(--primary-color);
        }

        #edit-order-modal select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 10px;
            color: #eafcff;
            font-size: 14px;
            outline: none;
        }

        #edit-order-modal select option {
            background: #0a0a0a;
            color: white;
        }

        .edit-items-list {
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .edit-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .edit-item-row input[type="number"] {
            width: 60px;
            padding: 5px;
            text-align: center;
        }

        /* MODERN TOAST NOTIFICATIONS */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: rgba(12, 16, 20, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 12px;
            color: #eafcff;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 300px;
            max-width: 450px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            font-size: 1.5rem;
        }

        .toast-success i {
            color: #00ff80;
            text-shadow: 0 0 10px rgba(0, 255, 128, 0.5);
        }

        .toast-error i {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        .toast-info i {
            color: #00c9ff;
            text-shadow: 0 0 10px rgba(0, 201, 255, 0.5);
        }

        .toast-content h4 {
            margin: 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toast-content p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* CUSTOM ALERT MODAL IMPROVEMENTS */
        #confirm-dialog .modal-content {
            background: rgba(12, 16, 20, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 255, 0.2);
            color: #eafcff;
            text-align: center;
            padding: 40px;
        }

        #confirm-message {
            color: #eafcff !important;
            font-size: 1.1rem;
            margin: 20px 0 30px 0 !important;
        }

        .modal-icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 2.5rem;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.4);
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img class="admin-logo" src="assets/img/logos/logo-menta.png" alt="808 PULSE Logo">
            <h1></h1>
            <h1>Panel de Administración</h1>
        </div>



        <div class="tabs">
            <button class="tab active" onclick="showTab('dashboard', this)">Dashboard</button>
            <button class="tab" onclick="showTab('orders', this)">Órdenes</button>
            <button class="tab" onclick="showTab('tickets', this)">Tickets</button>
            <button class="tab" onclick="showTab('accounting', this)">Contabilidad</button>
            <button class="tab" onclick="showTab('scanner', this)">Escáner QR</button>
        </div>

        <div class="tab-content">
            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-pane active">
                <h2>Estadísticas</h2>
                <div style="margin:10px 0 16px;">
                    <button id="clear-dashboard-btn" class="btn" onclick="clearDashboard()">Limpiar</button>
                </div>
                <div class="stats-grid" id="stats-container">
                    <!-- Stats will be loaded here -->
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="orders" class="tab-pane">
                <h2>Gestión de Órdenes</h2>
                <div style="margin:10px 0 16px;">
                    <button id="clear-orders-btn" class="btn" onclick="clearOrders()">Limpiar</button>
                </div>
                <div id="orders-container">
                    <!-- Orders will be loaded here -->
                </div>
            </div>

            <!-- Tickets Tab -->
            <div id="tickets" class="tab-pane">
                <h2>Tickets Generados</h2>
                <div style="margin:10px 0 16px;">
                    <button id="clear-tickets-btn" class="btn" onclick="clearTickets()">Limpiar</button>
                </div>
                <div id="tickets-container">
                    <!-- Tickets will be loaded here -->
                </div>
            </div>

            <!-- Accounting Tab -->
            <div id="accounting" class="tab-pane">
                <h2>Contabilidad por Evento</h2>
                <div class="filters"
                    style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:20px; flex-wrap:wrap;">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <input type="date" id="acct-from"
                            style="padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px;">
                        <span>a</span>
                        <input type="date" id="acct-to"
                            style="padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px;">
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary" onclick="loadAccounting()">Aplicar</button>
                        <button class="btn" onclick="exportAccountingExcel()">Exportar Excel</button>
                        <button id="clear-accounting-btn" class="btn" onclick="clearAccounting()">Limpiar</button>
                    </div>
                </div>
                <div class="table-container">
                    <div id="accounting-container">
                        <!-- Table will be injected here -->
                    </div>
                </div>

    <script>
        const API_HOSTNAME = window.location.hostname || 'localhost';
        const API_BASE = `http://${API_HOSTNAME}:3002/api`;
        // --- Auth helpers ---
        function getToken() { return sessionStorage.getItem('adminToken'); }
        function authHeaders() {
            const t = getToken();
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }
        async function fetchWithAuth(url, options = {}) {
            const headers = Object.assign({}, options.headers || {}, authHeaders(), { 'Content-Type': 'application/json' });
            const res = await fetch(url, Object.assign({}, options, { headers }));
            if (res.status === 401 || res.status === 403) {
                alert('Sesión inválida o expirada. Inicia sesión nuevamente.');
                window.location.href = '../index.html';
                throw new Error('Unauthorized');
            }
            return res;
        }
        // Logout helper
        function addLogoutButton() {
            if (document.getElementById('logout-btn')) return;
            const btn = document.createElement('button');
            btn.id = 'logout-btn';
            btn.textContent = 'Cerrar sesión';
            btn.className = 'cta-button login-button ghost nav-panel-btn neon-ghost-large';
            btn.style.position = 'fixed';
            btn.style.top = '12px';
            btn.style.right = '12px';
            btn.style.zIndex = '1000';
            btn.addEventListener('click', () => {
                sessionStorage.removeItem('adminToken');
                window.location.href = '../index.html';
            });
            document.body.appendChild(btn);
        }

        // Home button helper
        function addHomeButton() {
            if (document.getElementById('home-btn')) return;
            const btn = document.createElement('button');
            btn.id = 'home-btn';
            btn.textContent = 'Inicio';
            btn.className = 'cta-button login-button ghost nav-panel-btn neon-ghost-large';
            btn.style.position = 'fixed';
            btn.style.top = '12px';
            btn.style.left = '12px';
            btn.style.zIndex = '1000';
            btn.addEventListener('click', () => {
                window.location.href = '../index.html';
            });
            document.body.appendChild(btn);
        }

        // Tab functionality
        function showTab(tabName, el) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

            // If el is provided, use it, otherwise find the button by its onclick/text
            if (el) {
                el.classList.add('active');
            } else {
                const tabs = document.querySelectorAll('.tab');
                for (let t of tabs) {
                    if (t.getAttribute('onclick')?.includes(`'${tabName}'`)) {
                        t.classList.add('active');
                        break;
                    }
                }
            }

            const pane = document.getElementById(tabName);
            if (pane) pane.classList.add('active');

            // Load data for the selected tab
            switch (tabName) {
                case 'dashboard':
                    loadDashboard();
                    break;
                case 'orders':
                    loadOrders();
                    break;
                case 'tickets':
                    loadTickets();
                    break;
                case 'accounting':
                    loadAccounting();
                    break;
            }
        }

        // Enforce auth on load
        (function enforceAuth() {
            if (!getToken()) {
                alert('Acceso restringido. Por favor inicia sesión como administrador.');
                window.location.href = '../index.html';
            }
            addLogoutButton();
            addHomeButton();
        })();

                const response = await fetchWithAuth(`${API_BASE}/admin/dashboard`);

        // Load accounting (per-event totals)
        async function loadAccounting() {
            try {
                const fromEl = document.getElementById('acct-from');
                const toEl = document.getElementById('acct-to');
                const from = fromEl && fromEl.value ? `from=${encodeURIComponent(fromEl.value)}` : '';
                const to = toEl && toEl.value ? `to=${encodeURIComponent(toEl.value)}` : '';
                const qs = [from, to].filter(Boolean).join('&');
                const url = qs ? `${API_BASE}/admin/accounting?${qs}` : `${API_BASE}/admin/accounting`;
                const response = await fetchWithAuth(url);
                const data = await response.json();

                // Guardar la última data para exportación
                window._lastAccounting = data && data.accounting ? data.accounting : [];

                const rows = (data.accounting || []).map(ev => `
                    <tr>
                        <td style="padding:10px 12px; border-bottom:1px solid #eee;">${ev.eventName}</td>
                        <td style="padding:10px 12px; border-bottom:1px solid #eee; text-align:right;">${ev.ticketsSold}</td>
                        <td style="padding:10px 12px; border-bottom:1px solid #eee; text-align:right;">$${Number(ev.revenue).toLocaleString('es-CO', { minimumFractionDigits: 0 })}</td>
                        <td style="padding:10px 12px; border-bottom:1px solid #eee; text-align:right;">${ev.ticketsGenerated}</td>
                        <td style="padding:10px 12px; border-bottom:1px solid #eee; text-align:right;">${ev.ticketsUsed}</td>
                        <td style="padding:10px 12px; border-bottom:1px solid #eee; text-align:center; display: flex; gap: 8px; justify-content: center;">
                            <button class="btn btn-warning" onclick="deleteLastOrder(${ev.eventId}, '${ev.eventName}')" title="Borrar última venta">
                                <i class="fas fa-undo"></i>
                            </button>
                            <button class="btn btn-danger" onclick="clearEventAccounting(${ev.eventId}, '${ev.eventName}')" title="Vaciar todo el evento">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                const accountingContainer = document.getElementById('accounting-container');
                accountingContainer.innerHTML = `
                    <div style="overflow:auto;">
                        <table style="width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden;">
                            <thead>
                                <tr style="background:#f1f5f9; color:#0f172a;">
                                    <th style="text-align:left; padding:12px;">Evento</th>
                                    <th style="text-align:right; padding:12px;">Entradas vendidas</th>
                                    <th style="text-align:right; padding:12px;">Recaudación</th>
                                    <th style="text-align:right; padding:12px;">Tickets generados</th>
                                    <th style="text-align:right; padding:12px;">Tickets usados</th>
                                    <th style="text-align:center; padding:12px;">Acciones</th>

                            <tbody>
                                ${rows || '<tr><td colspan="6" style="padding:16px; text-align:center; color:#64748b;">Sin datos</td></tr>'}

                        </table>
                    </div>

                const abtn = document.getElementById('clear-accounting-btn');
                if (abtn) abtn.textContent = 'Limpiar filtros';
            } catch (error) {
                console.error('Error loading accounting:', error);
                const accountingContainer = document.getElementById('accounting-container');
                accountingContainer.innerHTML = `<div style="background:#f8d7da; color:#721c24; padding: 20px; border-radius: 10px;">Error cargando contabilidad</div>`;
            }

        async function clearEventAccounting(eventId, eventName) {
            const ok = await confirmDialog(
                `¿Deseas reiniciar TODA la contabilidad del evento "${eventName}"? Se borrarán todas las órdenes y tickets asociados.`,
                'BORRADO TOTAL',
                'exclamation-triangle'
            );
            if (!ok) return;

            try {
                const response = await fetchWithAuth(`${API_BASE}/admin/accounting/event/${eventId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('Éxito', `Contabilidad de ${eventName} reiniciada`, 'success');
                    loadAccounting();
                    loadDashboard();
                    loadOrders();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error clearing accounting:', error);
            }
        }

        async function deleteLastOrder(eventId, eventName) {
            const ok = await confirmDialog(
                `¿Confirmas que deseas borrar la ÚLTIMA venta del evento "${eventName}"?`,
                'Deshacer Venta',
                'undo'
            );
            if (!ok) return;

            try {
                const response = await fetchWithAuth(`${API_BASE}/admin/accounting/event/${eventId}/last`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('Éxito', 'Última venta eliminada correctamente', 'success');
                    loadAccounting();
                    loadDashboard();
                    loadOrders();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error deleting last order:', error);
            }
        }

        function exportAccountingExcel() {
            try {
                const data = Array.isArray(window._lastAccounting) ? window._lastAccounting : [];
                const from = document.getElementById('acct-from')?.value || '';
                const to = document.getElementById('acct-to')?.value || '';
                const rangeText = from || to ? ` (del ${from || ''} al ${to || ''})` : '';

                let excelContent = `
                    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                    <head>
                        <meta charset="UTF-8">
                        <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Contabilidad</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
                        <style>
                            table { border-collapse: collapse; width: 100%; font-family: 'Segoe UI', Arial, sans-serif; border: 1px solid #cbd5e1; }
                            th { background-color: #0f172a; color: #ffffff; font-weight: bold; border: 1px solid #cbd5e1; padding: 12px; text-align: center; }
                            td { border: 1px solid #cbd5e1; padding: 10px; color: #1e293b; }
                            .number { text-align: right; }
                            .title-cell { font-size: 18px; font-weight: bold; background-color: #f8fafc; text-align: center; color: #0f172a; padding: 20px; }
                            .header-row { background-color: #334155; color: white; }
                        </style>
                    </head>
                    <body>
                        <table>
                            <tr><th colspan="5" class="title-cell">REPORTA DE CONTABILIDAD - 808 PULSE${rangeText.toUpperCase()}</th></tr>
                            <tr class="header-row">
                                <th>EVENTO</th>
                                <th>ENTRADAS VENDIDAS</th>
                                <th>RECAUDACIÓN (COP)</th>
                                <th>TICKETS GENERADOS</th>
                                <th>TICKETS USADOS</th>
                            </tr>
                            ${data.map(ev => `
                                <tr>
                                    <td>${(ev.eventName || '').toUpperCase()}</td>
                                    <td class="number">${ev.ticketsSold ?? 0}</td>
                                    <td class="number">$${Number(ev.revenue || 0).toLocaleString('es-CO')}</td>
                                    <td class="number">${ev.ticketsGenerated ?? 0}</td>
                                    <td class="number">${ev.ticketsUsed ?? 0}</td>
                                </tr>
                            `).join('')}
                            ${data.length === 0 ? '<tr><td colspan="5" style="text-align:center;">No hay datos disponibles</td></tr>' : ''}
                        </table>
                    </body>
                    </html>
                `;

                const blob = new Blob([excelContent], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const dateStr = new Date().toISOString().split('T')[0];
                const suffix = from || to ? `_${from || ''}_a_${to || ''}` : `_${dateStr}`;
                a.download = `Reporte_Contabilidad_808Pulse${suffix}.xls`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Error exporting Excel:', e);
                alert('No se pudo exportar el archivo Excel. Asegúrate de tener datos cargados.');
            }
        }

        // --- Clear helpers (por módulo) ---
        // Dashboard: solo limpiar UI (no borra DB) y recargar estadísticas
        async function clearDashboard() {
            const el = document.getElementById('stats-container');
            if (el) el.innerHTML = '<div style="padding:12px; color:#64748b;">Estadísticas limpiadas.</div>';
            await loadDashboard();
        }

        // --- Notification helpers ---
        function showToast(title, message, type = 'info', duration = 4000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let icon = 'info-circle';
            if (type === 'success') icon = 'check-circle';
            if (type === 'error') icon = 'exclamation-circle';

            toast.innerHTML = `
                <div class="toast-icon"><i class="fas fa-${icon}"></i></div>
                <div class="toast-content">
                    <h4>${title}</h4>
                    <p>${message}</p>
                </div>
            `;

            container.appendChild(toast);

            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 100);

            // Auto remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // Helper para mostrar confirm dialog
        function confirmDialog(message, title = 'Confirmar acción', icon = 'question-circle') {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirm-dialog');
                const titleEl = document.getElementById('confirm-title');
                const msgEl = document.getElementById('confirm-message');
                const iconContainer = document.getElementById('confirm-icon-container');
                const yes = document.getElementById('confirm-yes');
                const no = document.getElementById('confirm-no');

                titleEl.textContent = title;
                msgEl.textContent = message || '¿Estás seguro?';
                iconContainer.innerHTML = `<i class="fas fa-${icon}"></i>`;

                modal.style.display = 'block';
                const cleanup = () => { modal.style.display = 'none'; yes.onclick = null; no.onclick = null; };
                yes.onclick = () => { cleanup(); resolve(true); };
                no.onclick = () => { cleanup(); resolve(false); };
            });
        }

        // Órdenes: eliminar TODO en DB (cascada) y recargar vistas relacionadas
        async function clearOrders() {
            try {
                const countLabel = document.getElementById('clear-orders-btn')?.textContent || '';
                const count = (countLabel.match(/\((\d+)\)/) || [])[1] || '0';
                const ok = await confirmDialog(`¿Eliminar TODAS las órdenes (${count}) y sus datos asociados?`);
                if (!ok) return;
                const btn = document.getElementById('clear-orders-btn');
                if (btn) { btn.disabled = true; btn.textContent = 'Limpiando...'; }
                await fetchWithAuth(`${API_BASE}/admin/orders`, { method: 'DELETE', body: JSON.stringify({}) });
            } catch (e) {
                console.error('Error limpieza órdenes:', e);
            } finally {
                const btn = document.getElementById('clear-orders-btn');
                if (btn) { btn.disabled = false; }
                loadOrders();
                loadDashboard();
                loadAccounting();
            }
        }

        // Tickets: eliminar TODO en DB y recargar vistas relacionadas
        async function clearTickets() {
            try {
                const countLabel = document.getElementById('clear-tickets-btn')?.textContent || '';
                const count = (countLabel.match(/\((\d+)\)/) || [])[1] || '0';
                const ok = await confirmDialog(`¿Eliminar TODOS los tickets (${count})?`);
                if (!ok) return;
                const btn = document.getElementById('clear-tickets-btn');
                if (btn) { btn.disabled = true; btn.textContent = 'Limpiando...'; }
                await fetchWithAuth(`${API_BASE}/admin/tickets`, { method: 'DELETE', body: JSON.stringify({}) });
            } catch (e) {
                console.error('Error limpieza tickets:', e);
            } finally {
                const btn = document.getElementById('clear-tickets-btn');
                if (btn) { btn.disabled = false; }
                loadTickets();
                loadDashboard();
                loadAccounting();
            }
        }

        // Contabilidad: solo limpiar UI y filtros, sin tocar DB
        async function clearAccounting() {
            const fromEl = document.getElementById('acct-from');
            const toEl = document.getElementById('acct-to');
            if (fromEl) fromEl.value = '';
            if (toEl) toEl.value = '';
            window._lastAccounting = [];
            const el = document.getElementById('accounting-container');
            if (el) el.innerHTML = '<div style="padding:12px; color:#64748b;">Contabilidad limpiada.</div>';
            await loadAccounting();
        }

        // Show list of tickets by type in modal (type: 'used' | 'active')
        async function showTicketsList(type) {
            try {
                const titleEl = document.getElementById('tickets-list-title');
                const bodyEl = document.getElementById('tickets-list-body');
                titleEl.textContent = type === 'used' ? 'Tickets usados' : 'Tickets no usados';
                bodyEl.innerHTML = '<div style="padding:12px; color:#64748b;">Cargando...</div>';

                const res = await fetchWithAuth(`${API_BASE}/admin/tickets`);
                const data = await res.json();
                const targetStatus = type === 'used' ? 'used' : 'active';
                const list = (data.tickets || []).filter(t => t.status === targetStatus);

                if (!list.length) {
                    bodyEl.innerHTML = '<div style="padding:12px; color:#64748b;">No hay tickets para mostrar.</div>';
                } else {
                    const rows = list.map(t => `
                        <tr>
                            <td style="padding:8px 10px; border-bottom:1px solid #eee;">${t.ticketId}</td>
                            <td style="padding:8px 10px; border-bottom:1px solid #eee;">${t.eventName}</td>
                            <td style="padding:8px 10px; border-bottom:1px solid #eee;">${t.customerName || ''}</td>
                            <td style="padding:8px 10px; border-bottom:1px solid #eee;">${t.status.toUpperCase()}</td>
                            <td style="padding:8px 10px; border-bottom:1px solid #eee; text-align:right;">${t.usedAt ? new Date(t.usedAt).toLocaleString('es-ES') : '-'}</td>
                        </tr>
                    `).join('');

                    bodyEl.innerHTML = `
                        <div style="overflow:auto;">
                            <table style="width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden;">
                                <thead>
                                    <tr style="background:#f1f5f9; color:#0f172a;">
                                        <th style="text-align:left; padding:10px;">Ticket</th>
                                        <th style="text-align:left; padding:10px;">Evento</th>
                                        <th style="text-align:left; padding:10px;">Cliente</th>
                                        <th style="text-align:left; padding:10px;">Estado</th>
                                        <th style="text-align:right; padding:10px;">Usado el</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                document.getElementById('tickets-list-modal').style.display = 'block';
            } catch (e) {
                console.error('Error cargando listado de tickets:', e);
                alert('No se pudo cargar el listado de tickets');
            }
        }

        function closeTicketsList() {
            document.getElementById('tickets-list-modal').style.display = 'none';
        }

        // Confirm payment directly
        async function confirmPayment(orderId, btnEvent) {
            const ok = await confirmDialog(
                `¿Confirmar el pago para la orden #${orderId}? Se generarán los tickets y se enviarán al cliente.`,
                'Confirmar Pago',
                'credit-card'
            );
            if (!ok) return;

            try {
                const btn = (btnEvent && btnEvent.target) || (window.event && window.event.target);
                const originalText = btn ? btn.textContent : '';
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
                }

                const response = await fetchWithAuth(`${API_BASE}/admin/confirm-payment/${orderId}`, {
                    method: 'POST',
                    body: JSON.stringify({})
                });

                const data = await response.json().catch(() => ({ message: 'Respuesta inválida del servidor' }));

                if (response.ok) {
                    showToast('¡Éxito!', 'Pago confirmado y tickets enviados correctamente por correo.', 'success');

                    showTab('orders');
                    loadDashboard();
                } else {
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = originalText;
                    }
                    showToast('Error', data.message || 'No se pudo confirmar el pago', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error fatal', 'Ocurrió un error al procesar la confirmación', 'error');
            }
        }

        function closeModal() {
            // Ya no es necesario si el modal fue eliminado, pero lo mantenemos por si acaso hay referencias
            const modal = document.getElementById('payment-modal');
            if (modal) modal.style.display = 'none';
        }

        // Show generated tickets with QR codes
        function showGeneratedTickets(tickets) {
            const ticketsHtml = tickets.map(ticket => {
                const token = ticket.qrToken || (ticket.verifyUrl ? (new URL(ticket.verifyUrl)).pathname.split('/').pop() : null);
                return `
                <div class="qr-container" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,255,0.2); border-radius: 12px; margin-bottom: 20px; padding: 15px;">
                    <h4 style="color: var(--primary-color); margin-bottom: 8px;">${ticket.ticketId}</h4>
                    <p style="margin-bottom: 8px;">${ticket.eventName}</p>
                    <img src="${ticket.qrData}" alt="QR Code" class="qr-code" style="max-width: 150px; filter: drop-shadow(0 0 5px rgba(0,255,255,0.3));">
                    <p><small>Expira: ${new Date(ticket.expiresAt).toLocaleString('es-ES')}</small></p>
                    ${token ? `<p style="margin-top: 8px;"><small>Token: <code>${token}</code> <button class="btn" style="padding: 4px 8px; font-size: 11px;" onclick=\"navigator.clipboard.writeText('${token}').then(()=>alert('Token copiado'))\">Copiar</button></small></p>` : ''}
                </div>
            `}).join('');

            // Intentar abrir en nueva ventana
            let newWindow = null;
            try {
                newWindow = window.open('', '_blank');
            } catch (e) {
                console.warn('[ADMIN UI] Popup bloqueado:', e);
            }

            // Si la ventana se abrió correctamente, usarla
            if (newWindow && newWindow.document) {
                newWindow.document.write(`
                    <html>
                        <head>
                            <title>Tickets Generados</title>
                            <style>
                                body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #eafcff; padding: 40px; text-align: center; }
                                .qr-container { background: #111; border: 1px solid #00FFFF; border-radius: 16px; padding: 20px; margin: 20px auto; max-width: 400px; }
                                .qr-code { max-width: 200px; }
                                code { background: #222; padding: 2px 5px; border-radius: 4px; color: #00FFFF; }
                                button { background: #00FFFF; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
                            </style>
                        </head>
                        <body>
                            <h2>Tickets Generados Exitosamente</h2>
                            ${ticketsHtml}
                            <button onclick="window.print()">Imprimir Tickets</button>
                        </body>
                    </html>
                `);
                return;
            }

            // Fallback: Mostrar en el modal existente en lugar de cambiar de pestaña
            const titleEl = document.getElementById('tickets-list-title');
            const bodyEl = document.getElementById('tickets-list-body');
            const modal = document.getElementById('tickets-list-modal');

            titleEl.textContent = 'Tickets Generados';
            bodyEl.innerHTML = `
                <div style="text-align: center; padding: 10px;">
                    <p style="color: #00ff80; margin-bottom: 20px; font-weight: bold;">
                        <i class="fas fa-check-circle"></i> Los tickets han sido generados y enviados por correo.
                    </p>
                    ${ticketsHtml}
                    <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
                    <button class="btn" onclick="closeTicketsList()" style="margin-left: 10px;">Cerrar</button>
                </div>
            `;

            modal.style.display = 'block';
            console.log('[ADMIN UI] Mostrando tickets en modal fallback.');
        }

        // Verificación reutilizable (GET)
        async function verifyToken(token) {
            const resultDiv = document.getElementById('scan-result');
            try {
                if (token && typeof token === 'object') {
                    token = token.token || token.qrToken || JSON.stringify(token);
                }
                if (typeof token !== 'string') throw new Error('Token inválido');
                token = token.trim();

                console.log(`[SCANNER] Verificando token: ${token} en ${API_BASE}/tickets/verify/...`);
                const verifyResp = await fetch(`${API_BASE}/tickets/verify/${encodeURIComponent(token)}`);
                const verifyData = await verifyResp.json();

                if (verifyResp.ok && verifyData.valid) {
                    const isUsed = verifyData.ticket.used;
                    const usedAtStr = isUsed && verifyData.ticket.usedAt ? new Date(verifyData.ticket.usedAt).toLocaleString('es-ES') : '';

                    if (isUsed) {
                        resultDiv.innerHTML = `
                            <div class="scan-alert scan-alert-used">
                                <i class="fas fa-history"></i>
                                <h3>QR ya utilizado</h3>
                                <p>Este ticket ya fue validado ${usedAtStr ? 'el ' + usedAtStr : ''}</p>
                                <div class="scan-details">
                                    <p><strong>Ticket:</strong> ${verifyData.ticket.ticketId}</p>
                                    <p><strong>Evento:</strong> ${verifyData.ticket.eventName}</p>
                                    <p><strong>Cliente:</strong> ${verifyData.ticket.customerName}</p>
                                    <p><strong>Cédula:</strong> ${verifyData.ticket.customerCedula || 'No disponible'}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="scan-alert scan-alert-valid">
                                <i class="fas fa-check-circle"></i>
                                <h3>Entrada Válida</h3>
                                <div class="scan-details">
                                    <p><strong>Ticket:</strong> ${verifyData.ticket.ticketId}</p>
                                    <p><strong>Evento:</strong> ${verifyData.ticket.eventName}</p>
                                    <p><strong>Cliente:</strong> ${verifyData.ticket.customerName}</p>
                                    <p><strong>Cédula:</strong> ${verifyData.ticket.customerCedula || 'No disponible'}</p>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <div class="scan-alert scan-alert-invalid">
                            <i class="fas fa-times-circle"></i>
                            <h3>QR no válido</h3>
                            <p>${verifyData.message || 'El código no corresponde a un ticket activo'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('[SCANNER] Error verificando ticket:', error);
                resultDiv.innerHTML = `
                    <div class="scan-alert scan-alert-invalid">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error de conexión</h3>
                        <p>No se pudo conectar con el servidor en ${API_BASE}. Revisa tu conexión.</p>
                    </div>
                `;
            }
        }

        // Marcar ticket como usado (POST) y mostrar resultado
        async function useToken(token) {
            const resultDiv = document.getElementById('scan-result');
            try {
                if (token && typeof token === 'object') {
                    token = token.token || token.qrToken || JSON.stringify(token);
                }
                if (typeof token !== 'string') throw new Error('Token inválido');
                token = token.trim();

                console.log(`[SCANNER] Intentando marcar como usado: ${token} en ${API_BASE}/admin/scan-ticket/...`);
                const useResp = await fetchWithAuth(`${API_BASE}/admin/scan-ticket/${encodeURIComponent(token)}`, {
                    method: 'POST'
                });
                // Como fetchWithAuth ya maneja errores de auth, aquí procesamos el resultado normal
                const useData = await useResp.json();

                if (useResp.ok && useData.success) {
                    const usedAtStr = useData.ticket && useData.ticket.usedAt ? new Date(useData.ticket.usedAt).toLocaleString('es-ES') : '';
                    resultDiv.innerHTML = `
                        <div class="scan-alert scan-alert-valid">
                            <i class="fas fa-check-circle"></i>
                            <h3>Acceso Permitido</h3>
                            <p>Ticket validado exitosamente</p>
                            <div class="scan-details">
                                <p><strong>Hora:</strong> ${usedAtStr || 'Ahora'}</p>
                                <p><strong>Ticket:</strong> ${useData.ticket.ticketId}</p>
                                <p><strong>Evento:</strong> ${useData.ticket.eventName || ''}</p>
                                <p><strong>Cliente:</strong> ${useData.ticket.customerName || ''}</p>
                                <p><strong>Cédula:</strong> ${useData.ticket.customerCedula || 'No disponible'}</p>
                            </div>
                            <div id="cooldown-container">
                                <div class="cooldown-progress-container">
                                    <div id="cooldown-bar" class="cooldown-progress-bar" style="width: 100%;"></div>
                                </div>
                                <p id="cooldown-timer" style="margin-top:10px; font-size: 0.9rem; font-weight: 600;">Siguiente escaneo en 5s</p>
                            </div>
                        </div>
                    `;
                    return { success: true, alreadyUsed: false };
                } else {
                    const details = useData && useData.details ? useData.details : null;
                    const usedAtStr = details && details.usedAt ? new Date(details.usedAt).toLocaleString('es-ES') : '';
                    const isUsed = (useData && typeof useData.message === 'string' && useData.message.toLowerCase().includes('ya utilizado')) || !!usedAtStr;

                    if (isUsed) {
                        resultDiv.innerHTML = `
                            <div class="scan-alert scan-alert-used">
                                <i class="fas fa-exclamation-circle"></i>
                                <h3>QR ya utilizado</h3>
                                <p>Este ticket ya fue validado anteriormente</p>
                                <div class="scan-details">
                                    <p><strong>Cliente:</strong> ${details ? details.customerName : 'No disponible'}</p>
                                    <p><strong>Cédula:</strong> ${details ? details.customerCedula || 'No disponible' : 'No disponible'}</p>
                                    <p><strong>Escaneado el:</strong> ${usedAtStr || 'No disponible'}</p>
                                    <p><strong>Ticket:</strong> ${details ? details.ticketId : 'No disponible'}</p>
                                </div>
                                <div id="cooldown-container">
                                    <div class="cooldown-progress-container">
                                        <div id="cooldown-bar" class="cooldown-progress-bar" style="width: 100%;"></div>
                                    </div>
                                    <p id="cooldown-timer" style="margin-top:10px; font-size: 0.9rem; font-weight: 600;">Siguiente escaneo en 5s</p>
                                </div>
                            </div>
                        `;
                        return { success: false, alreadyUsed: true };
                    } else {
                        resultDiv.innerHTML = `
                            <div class="scan-alert scan-alert-invalid">
                                <i class="fas fa-times-circle"></i>
                                <h3>QR no válido</h3>
                                <p>${useData.message || 'El código no corresponde a un ticket de este evento'}</p>
                            </div>
                        `;
                        return { success: false, alreadyUsed: false };
                    }
                }
            } catch (err) {
                console.error('[SCANNER] Error usando ticket:', err);
                resultDiv.innerHTML = `
                    <div class="scan-alert scan-alert-invalid">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error de conexión</h3>
                        <p>No se pudo conectar con el servidor en ${API_BASE}. Revisa tu conexión Wi-Fi o si el backend está activo.</p>
                    </div>
                `;
                return { success: false, alreadyUsed: false };
            }
        }

        function startCooldown(seconds) {
            scanningBusy = true;
            let remaining = seconds;
            const timerEl = document.getElementById('cooldown-timer');
            const barEl = document.getElementById('cooldown-bar');

            const interval = setInterval(() => {
                remaining--;
                if (timerEl) {
                    timerEl.textContent = `Siguiente escaneo en ${remaining}s`;
                }
                if (barEl) {
                    barEl.style.width = ((remaining / seconds) * 100) + '%';
                }

                if (remaining <= 0) {
                    clearInterval(interval);
                    scanningBusy = false;
                    if (timerEl) timerEl.textContent = 'Scanner listo';
                    if (barEl) barEl.style.width = '0%';
                }
            }, 1000);
        }

        // Scan ticket functionality (marcar usado al escanear)
        async function scanTicket() {
            if (scanningBusy) {
                console.warn('[SCANNER] Scanner is busy (cloodown active)');
                return;
            }

            const qrInput = document.getElementById('qr-input').value.trim();

            if (!qrInput) {
                alert('Por favor ingresa el código QR');
                return;
            }

            try {
                // Extraer token del contenido QR (JSON) o usar directamente
                let token = qrInput;
                try {
                    const qrData = JSON.parse(qrInput);
                    token = qrData.token || qrData.qrToken || qrInput;
                } catch (e) {
                    // No es JSON; usar la cadena directa como token
                }

                const result = await useToken(token);
                if (result.success || result.alreadyUsed) {
                    startCooldown(5);
                }

                document.getElementById('qr-input').value = '';
            } catch (error) {
                console.error('Error scanning ticket:', error);
                document.getElementById('scan-result').innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 10px; margin-top:15px; border: 1px solid #f5c6cb;">
                        <h3>❌ Error</h3>
                        <p>Error escaneando el ticket</p>
                    </div>
                `;
            }
        }

        // Camera scanner setup
        let qrScanner = null;
        const videoEl = document.getElementById('qr-video');
        const startBtn = document.getElementById('start-camera-btn');
        const stopBtn = document.getElementById('stop-camera-btn');

        let scanningBusy = false;
        function setupCameraScanner() {
            if (!window.QrScanner) {
                console.error('QrScanner library not loaded');
                return;
            }
            if (qrScanner) return; // already initialized
            qrScanner = new QrScanner(videoEl, result => {
                // result is the decoded string from QR
                try {
                    const raw = (result && typeof result === 'object' && 'data' in result) ? result.data : result;
                    let token = raw;
                    try {
                        const qrData = JSON.parse(raw);
                        token = qrData.token || qrData.qrToken || raw;
                    } catch (_) { }
                    if (scanningBusy) return;
                    useToken(token).then(res => {
                        if (res.success || res.alreadyUsed) startCooldown(5);
                        else {
                            // Breve pausa si es otro error (invalido, red) para evitar ráfagas
                            scanningBusy = true;
                            setTimeout(() => { scanningBusy = false; }, 1500);
                        }
                    });
                } catch (e) {
                    console.error('Error manejando resultado de cámara:', e);
                }
            }, { highlightScanRegion: true, highlightCodeOutline: true });
        }

        startBtn.addEventListener('click', async () => {
            setupCameraScanner();
            try {
                videoEl.style.display = 'block';
                await qrScanner.start();
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
            } catch (e) {
                console.error('No se pudo iniciar la cámara:', e);
                alert('No se pudo iniciar la cámara. Revisa permisos del navegador.');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (qrScanner) qrScanner.stop();
            videoEl.style.display = 'none';
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        });

        // Image file scanning
        const fileInput = document.getElementById('qr-file');
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
                const result = await QrScanner.scanImage(file, { returnDetailedScanResult: true });
                const raw = (result && typeof result === 'object' && 'data' in result) ? result.data : result;
                let token = raw;
                try {
                    const qrData = JSON.parse(raw);
                    token = qrData.token || qrData.qrToken || raw;
                } catch (_) { }
                await verifyToken(token);
            } catch (err) {
                console.error('No se pudo leer el QR de la imagen:', err);
                document.getElementById('scan-result').innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 10px;">
                        <h3>❌ Error</h3>
                        <p>No se pudo leer el QR de la imagen</p>
                    </div>
                `;
            } finally {
                fileInput.value = '';
            }
        });

        // Allow Enter key to scan
        document.getElementById('qr-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scanTicket();
            }
        });

        // Edit Order functions
        function closeEditModal() {
            document.getElementById('edit-order-modal').style.display = 'none';
        }

        async function openEditOrderModal(orderUuid) {
            try {
                const response = await fetchWithAuth(`${API_BASE}/orders/${orderUuid}`);
                const order = await response.json();

                document.getElementById('edit-order-id').value = order.id;
                document.getElementById('edit-order-uuid').value = order.orderId;
                document.getElementById('edit-customer-name').value = order.customerName || '';
                document.getElementById('edit-customer-phone').value = order.customerPhone || '';
                document.getElementById('edit-customer-email').value = order.customerEmail || '';
                document.getElementById('edit-order-status').value = order.status;

                const itemsContainer = document.getElementById('edit-items-container');
                itemsContainer.innerHTML = order.items.map(item => `
                    <div class="edit-item-row" data-item-id="${item.id}">
                        <span>${item.eventName} ($${item.price.toLocaleString('es-CO')})</span>
                        <input type="number" class="edit-item-qty" value="${item.quantity}" min="0">
                    </div>
                `).join('');

                document.getElementById('edit-order-modal').style.display = 'block';
            } catch (error) {
                console.error('Error opening edit modal:', error);
                alert('No se pudo cargar la información de la orden');
            }
        }

        document.getElementById('edit-order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderUuid = document.getElementById('edit-order-uuid').value;
            const items = [];
            document.querySelectorAll('.edit-item-row').forEach(row => {
                items.push({
                    id: parseInt(row.dataset.itemId),
                    quantity: parseInt(row.querySelector('.edit-item-qty').value)
                });
            });

            const updateData = {
                customerInfo: {
                    name: document.getElementById('edit-customer-name').value,
                    phone: document.getElementById('edit-customer-phone').value,
                    email: document.getElementById('edit-customer-email').value
                },
                status: document.getElementById('edit-order-status').value,
                items: items
            };

            try {
                const response = await fetchWithAuth(`${API_BASE}/orders/${orderUuid}`, {
                    method: 'PUT',
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    alert('Orden actualizada correctamente');
                    closeEditModal();
                    loadOrders();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error saving order:', error);
                alert('Ocurrió un error al guardar los cambios');
            }
        });

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
