<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Panel de Administración</title>
    <style>
        :root {
            --primary-color: #00FFFF; /* Cian Neón */
            --dark-bg: #0a0a0a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000; /* Fondo sólido y suave */
            min-height: 100vh;
            padding: 20px;
            color: #eafcff; /* Texto claro global */
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(12, 16, 20, 0.55);
            border-radius: 16px;
            border: 1px solid rgba(0,255,255,0.18);
            box-shadow: 0 0 26px rgba(0,255,255,0.2), 0 22px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }
        
        .header {
            background: linear-gradient(135deg, rgba(0,201,255,0.95) 0%, rgba(146,254,157,0.85) 100%);
            color: #041014;
            padding: 32px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.25);
            box-shadow: inset 0 -6px 20px rgba(255,255,255,0.15), 0 6px 18px rgba(0,201,255,0.28);
        }
        
        .admin-logo {
            display: block;
            margin: 0 auto 10px auto;
            max-height: 70px;
            width: auto;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            background: rgba(10, 14, 18, 0.6);
            border-bottom: 1px solid rgba(0,255,255,0.2);
            backdrop-filter: blur(6px);
            box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06);
        }
        
        .tab {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            color: #eafcff;
        }
        
        .tab.active {
            background: rgba(0, 255, 255, 0.08);
            border-bottom: 3px solid #00c9ff;
            color: #00c9ff;
            box-shadow: 0 2px 12px rgba(0,255,255,0.18);
        }
        
        .tab-content {
            padding: 30px;
            min-height: 500px;
            background: linear-gradient(180deg, rgba(2, 8, 10, 0.35), rgba(2, 8, 10, 0.15));
            color: #eafcff;
        }

        /* Neon/Glass style for Accounting panel */
        #accounting-container {
            background: rgba(12, 16, 20, 0.65);
            border: 1px solid rgba(0,255,255,0.18);
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,255,255,0.22), inset 0 0 8px rgba(255,255,255,0.06);
            color: #0a0a0a;
            backdrop-filter: blur(8px);
            padding: 16px;
        }
        #accounting-container table { color: #0a0a0a; }
        #accounting-container thead tr {
            background: rgba(15, 23, 42, 0.65) !important;
        }
        #accounting-container th {
            color: #0a0a0a;
            border-bottom: 1px solid rgba(0,255,255,0.2);
        }
        #accounting-container td { color: #0a0a0a; }
        /* Neon styling for accounting filters */
        #accounting input[type="date"] {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(0,255,255,0.25);
            border-radius: 10px;
            color: #0a0a0a;
            padding: 8px 10px;
        }
        #accounting input[type="date"]::placeholder { color: rgba(10,10,10,0.55); }
        #accounting input[type="date"]:focus {
            outline: none;
            border-color: rgba(0,255,255,0.5);
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        
        .tab-pane {
            display: none;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        .order-card {
            background: rgba(12, 16, 20, 0.6);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0,255,255,0.18);
            box-shadow: 0 0 16px rgba(0,255,255,0.18), inset 0 0 8px rgba(255,255,255,0.06);
            backdrop-filter: blur(6px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            color: #eafcff;
        }
        .order-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0,255,255,0.35);
            box-shadow: 0 0 22px rgba(0,255,255,0.28), inset 0 0 10px rgba(255,255,255,0.08);
        }
        
        .order-card.confirmed {
            border-left-color: #28a745;
        }
        
        .order-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .order-id {
            font-weight: bold;
            font-size: 1.2em;
            color: #495057;
        }
        
        .order-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        
        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            background: rgba(0, 255, 255, 0.06);
            color: var(--primary-color);
            border: 1px solid rgba(0,255,255,0.45);
            box-shadow: 0 0 8px rgba(0,255,255,0.2);
            backdrop-filter: blur(4px);
        }
        
        .btn:hover {
            transform: translateY(-1px);
            background: rgba(0, 255, 255, 0.12);
            box-shadow: 0 0 14px rgba(0,255,255,0.35);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, rgba(0,255,255,0.95), rgba(0,255,255,0.75));
            color: #0a0a0a;
            border: 1px solid rgba(0,255,255,0.6);
            box-shadow: 0 0 10px rgba(0,255,255,0.35), inset 0 0 6px rgba(255,255,255,0.25);
        }
        /* Force neon style on top action buttons */
        #logout-btn, #home-btn {
            background: rgba(0, 255, 255, 0.08) !important;
            color: var(--primary-color) !important;
            border: 1px solid rgba(0,255,255,0.55) !important;
            padding: 10px 18px !important;
            font-size: 1rem !important;
            border-radius: 12px !important;
            box-shadow: 0 0 10px rgba(0,255,255,0.25), inset 0 0 8px rgba(255,255,255,0.15) !important;
            backdrop-filter: blur(6px) !important;
        }
        #logout-btn:hover, #home-btn:hover {
            background: rgba(0,255,255,0.14) !important;
            box-shadow: 0 0 18px rgba(0,255,255,0.45), inset 0 0 10px rgba(255,255,255,0.25) !important;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(0,255,255,1), rgba(0,255,255,0.85));
            box-shadow: 0 0 16px rgba(0,255,255,0.5);
        }
        
        .btn-success {
            background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(34,197,94,0.75));
            color: #0a0a0a;
            border: 1px solid rgba(34,197,94,0.6);
            box-shadow: 0 0 10px rgba(34,197,94,0.35), inset 0 0 6px rgba(255,255,255,0.2);
        }
        .btn-success:hover {
            background: linear-gradient(135deg, rgba(34,197,94,1), rgba(34,197,94,0.85));
            box-shadow: 0 0 16px rgba(34,197,94,0.5);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .qr-container {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .qr-code {
            max-width: 200px;
            margin: 10px auto;
        }
        
        .ticket-info {
            background: rgba(12, 16, 20, 0.6);
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid rgba(0,255,255,0.18);
            box-shadow: 0 0 14px rgba(0,255,255,0.16), inset 0 0 6px rgba(255,255,255,0.05);
            backdrop-filter: blur(6px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            color: #eafcff;
        }
        .ticket-info:hover {
            transform: translateY(-2px);
            border-color: rgba(0,255,255,0.32);
            box-shadow: 0 0 20px rgba(0,255,255,0.26);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(102,126,234,0.85) 0%, rgba(118,75,162,0.85) 100%);
            color: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(0,255,255,0.18);
            box-shadow: 0 0 18px rgba(0,255,255,0.18), inset 0 0 8px rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0,255,255,0.32);
            box-shadow: 0 0 24px rgba(0,255,255,0.28);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 5000;
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        
        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Neon/Glass style for Confirm Payment modal */
        #payment-modal .modal-content {
            background: rgba(12, 16, 20, 0.65);
            border: 1px solid rgba(0,255,255,0.18);
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,255,255,0.22), inset 0 0 8px rgba(255,255,255,0.06);
            color: #eafcff;
            backdrop-filter: blur(8px);
        }
        #payment-modal .close { color: var(--primary-color); text-shadow: 0 0 6px rgba(0,255,255,0.45); }
        #payment-modal .form-group label { color: #eafcff; }
        #payment-modal .form-group input[type="text"],
        #payment-modal .form-group input[type="tel"],
        #payment-modal .form-group input[type="email"] {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(0,255,255,0.25);
            border-radius: 10px;
            color: #eafcff;
            padding: 10px 12px;
        }
        #payment-modal .form-group input::placeholder { color: rgba(234,252,255,0.65); }
        #payment-modal .form-group input:focus {
            outline: none;
            border-color: rgba(0,255,255,0.5);
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img class="admin-logo" src="../logoblanco__1_-removebg-preview (1).png" alt="808 PULSE Logo">
            <h1></h1>
            <h1>Panel de Administración</h1>
        </div>

    
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('dashboard')">Dashboard</button>
            <button class="tab" onclick="showTab('orders')">Órdenes</button>
            <button class="tab" onclick="showTab('tickets')">Tickets</button>
            <button class="tab" onclick="showTab('accounting')">Contabilidad</button>
            <button class="tab" onclick="showTab('scanner')">Escáner QR</button>
        </div>
        
        <div class="tab-content">
            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-pane active">
                <h2>Estadísticas</h2>
                <div style="margin:10px 0 16px;">
                    <button id="clear-dashboard-btn" class="btn" onclick="clearDashboard()">Limpiar</button>
                </div>
                <div class="stats-grid" id="stats-container">
                    <!-- Stats will be loaded here -->
                </div>
            </div>
            
            <!-- Orders Tab -->
            <div id="orders" class="tab-pane">
                <h2>Gestión de Órdenes</h2>
                <div style="margin:10px 0 16px;">
                    <button id="clear-orders-btn" class="btn" onclick="clearOrders()">Limpiar</button>
                </div>
                <div id="orders-container">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
            
            <!-- Tickets Tab -->
            <div id="tickets" class="tab-pane">
                <h2>Tickets Generados</h2>
                <div style="margin:10px 0 16px;">
                    <button id="clear-tickets-btn" class="btn" onclick="clearTickets()">Limpiar</button>
                </div>
                <div id="tickets-container">
                    <!-- Tickets will be loaded here -->
                </div>
            </div>

            <!-- Accounting Tab -->
            <div id="accounting" class="tab-pane">
                <h2>Contabilidad por Evento</h2>
                <div style="display:flex; gap:12px; align-items:end; flex-wrap:wrap; margin:12px 0 16px 0;">
                    <div>
                        <label for="acct-from" style="display:block; font-weight:600; margin-bottom:4px;">Desde</label>
                        <input type="date" id="acct-from" style="padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px;">
                    </div>
                    <div>
                        <label for="acct-to" style="display:block; font-weight:600; margin-bottom:4px;">Hasta</label>
                        <input type="date" id="acct-to" style="padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px;">
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary" onclick="loadAccounting()">Aplicar</button>
                        <button class="btn" onclick="exportAccountingCSV()">Exportar CSV</button>
                        <button id="clear-accounting-btn" class="btn" onclick="clearAccounting()">Limpiar</button>
                    </div>
                </div>
                <div id="accounting-container">
                    <!-- Accounting table will be rendered here -->
                </div>
            </div>
            
            <!-- Scanner Tab -->
            <div id="scanner" class="tab-pane">
                <h2>Escáner de Entrada</h2>
                <div style="text-align: center;">
                    <input type="text" id="qr-input" placeholder="Escanea o ingresa el código QR" style="width: 300px; padding: 15px; font-size: 16px; margin: 20px;">
                    <br>
                    <button class="btn btn-primary" onclick="scanTicket()">Verificar Entrada</button>
                    
                    <!-- Camera Scanner UI -->
                    <div style="margin-top: 20px;"></div>
                    <video id="qr-video" style="width: 320px; max-width: 90%; border-radius: 10px; display:none;" muted playsinline></video>
                    <div id="camera-controls" style="margin-top: 10px;">
                        <button class="btn btn-primary" id="start-camera-btn">Iniciar cámara</button>
                        <button class="btn" id="stop-camera-btn" style="display:none;">Detener cámara</button>
                    </div>
                    
                    <!-- Image File Scan -->
                    <div style="margin-top: 20px;">
                        <label style="display:block; margin-bottom:8px;">O sube una imagen con el QR:</label>
                        <input type="file" id="qr-file" accept="image/*">
                    </div>
                </div>
                <div id="scan-result" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>
    
    <!-- Modal for confirming payment -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Confirmar Pago</h3>
            <form id="payment-form">
                <input type="hidden" id="order-id">
                <div class="form-group">
                    <label>Nombre del Cliente:</label>
                    <input type="text" id="customer-name" required>
                </div>
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="tel" id="customer-phone" required>
                </div>
                <div class="form-group">
                    <label>Email (opcional):</label>
                    <input type="email" id="customer-email">
                </div>
                <button type="submit" class="btn btn-success">Confirmar Pago y Generar QRs</button>
            </form>
        </div>
    </div>
    
    <!-- Modal to list tickets (used/active) - placed outside container to avoid clipping -->
    <div id="tickets-list-modal" class="modal" onclick="if(event.target.id==='tickets-list-modal'){closeTicketsList()}">
        <div class="modal-content" style="max-width: 800px;">
            <span class="close" onclick="closeTicketsList()">&times;</span>
            <h3 id="tickets-list-title" style="margin-bottom:12px;">Listado de tickets</h3>
            <div id="tickets-list-body" style="max-height: 60vh; overflow:auto;"></div>
        </div>
    </div>

    <!-- Confirm Dialog Modal -->
    <div id="confirm-dialog" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:420px;">
            <h3 style="margin-bottom:10px;">Confirmar acción</h3>
            <p id="confirm-message" style="margin-bottom:16px; color:#334155;">¿Estás seguro?</p>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button id="confirm-no" class="btn">No</button>
                <button id="confirm-yes" class="btn btn-primary">Sí</button>
            </div>
        </div>
    </div>

    <!-- QR Scanner Library (ES Module) -->
    <script type="module">
        import QrScanner from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';
        // Exponer para el resto del script (que no es módulo)
        window.QrScanner = QrScanner;
    </script>
    <script>
        const API_BASE = 'http://localhost:3002/api';
        // --- Auth helpers ---
        function getToken() { return localStorage.getItem('adminToken'); }
        function authHeaders() {
            const t = getToken();
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }
        async function fetchWithAuth(url, options = {}) {
            const headers = Object.assign({}, options.headers || {}, authHeaders(), { 'Content-Type': 'application/json' });
            const res = await fetch(url, Object.assign({}, options, { headers }));
            if (res.status === 401 || res.status === 403) {
                alert('Sesión inválida o expirada. Inicia sesión nuevamente.');
                window.location.href = '../index.html';
                throw new Error('Unauthorized');
            }
            return res;
        }
        // Logout helper
        function addLogoutButton(){
            if (document.getElementById('logout-btn')) return;
            const btn = document.createElement('button');
            btn.id = 'logout-btn';
            btn.textContent = 'Cerrar sesión';
            btn.className = 'cta-button login-button ghost nav-panel-btn neon-ghost-large';
            btn.style.position = 'fixed';
            btn.style.top = '12px';
            btn.style.right = '12px';
            btn.style.zIndex = '1000';
            btn.addEventListener('click', () => {
                localStorage.removeItem('adminToken');
                window.location.href = '../index.html';
            });
            document.body.appendChild(btn);
        }

        // Home button helper
        function addHomeButton(){
            if (document.getElementById('home-btn')) return;
            const btn = document.createElement('button');
            btn.id = 'home-btn';
            btn.textContent = 'Inicio';
            btn.className = 'cta-button login-button ghost nav-panel-btn neon-ghost-large';
            btn.style.position = 'fixed';
            btn.style.top = '12px';
            btn.style.left = '12px';
            btn.style.zIndex = '1000';
            btn.addEventListener('click', () => {
                window.location.href = '../index.html';
            });
            document.body.appendChild(btn);
        }
        
        // Tab functionality
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            // Load data for the selected tab
            switch(tabName) {
                case 'dashboard':
                    loadDashboard();
                    break;
                case 'orders':
                    loadOrders();
                    break;
                case 'tickets':
                    loadTickets();
                    break;
                case 'accounting':
                    loadAccounting();
                    break;
            }
        }
        
        // Enforce auth on load
        (function enforceAuth(){
            if (!getToken()) {
                alert('Acceso restringido. Por favor inicia sesión como administrador.');
                window.location.href = '../index.html';
            }
            addLogoutButton();
            addHomeButton();
        })();

        // Load dashboard stats
        async function loadDashboard() {
            try {
                const response = await fetchWithAuth(`${API_BASE}/admin/dashboard`);
                const data = await response.json();
                
                const statsContainer = document.getElementById('stats-container');
                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${data.stats.totalOrders}</div>
                        <div>Total Órdenes</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.stats.confirmedOrders}</div>
                        <div>Órdenes Confirmadas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.stats.totalTickets}</div>
                        <div>Tickets Generados</div>
                    </div>
                    <div class="stat-card" style="cursor:pointer;" onclick="showTicketsList('used')" title="Ver tickets usados">
                        <div class="stat-number">${data.stats.usedTickets}</div>
                        <div>Tickets Usados</div>
                    </div>
                    <div class="stat-card" style="cursor:pointer;" onclick="showTicketsList('active')" title="Ver tickets no usados">
                        <div class="stat-number">${data.stats.activeTickets}</div>
                        <div>Tickets no usados</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        // Load orders
        async function loadOrders() {
            try {
                const response = await fetchWithAuth(`${API_BASE}/admin/orders`);
                const data = await response.json();
                
                const ordersContainer = document.getElementById('orders-container');
                ordersContainer.innerHTML = data.orders.map(order => `
                    <div class="order-card ${order.status}">
                        <div class="order-header">
                            <div class="order-id">Orden: ${order.orderId}</div>
                            <div class="order-status status-${order.status}">${order.status.toUpperCase()}</div>
                        </div>
                        <p><strong>Total:</strong> $${order.total.toLocaleString('es-CO')}</p>

        function exportAccountingCSV() {
            try {
                const data = Array.isArray(window._lastAccounting) ? window._lastAccounting : [];
                const headers = ['Evento','Entradas vendidas','Recaudación','Tickets generados','Tickets usados'];
                const rows = data.map(ev => [
                    (ev.eventName || '').replaceAll('"', '""'),
                    ev.ticketsSold ?? 0,
                    ev.revenue ?? 0,
                    ev.ticketsGenerated ?? 0,
                    ev.ticketsUsed ?? 0
                ]);
                const csv = [headers.join(','), ...rows.map(r => r.map(v => typeof v === 'string' ? `"${v}"` : v).join(','))].join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const from = document.getElementById('acct-from')?.value || '';
                const to = document.getElementById('acct-to')?.value || '';
                const suffix = from || to ? `_${from || ''}_a_${to || ''}` : '';
                a.download = `contabilidad_por_evento${suffix}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Error exporting CSV:', e);
                alert('No se pudo exportar el CSV');
            }
        }

                    throw new Error('Token inválido');

                token = token.trim();
                const verifyResp = await fetch(`${API_BASE}/tickets/verify/${encodeURIComponent(token)}`);
                const verifyData = await verifyResp.json();
                if (verifyResp.ok && verifyData.valid) {
                    const usedInfo = verifyData.ticket.used ? ` (ya usado ${verifyData.ticket.usedAt ? 'el ' + new Date(verifyData.ticket.usedAt).toLocaleString('es-ES') : ''})` : '';

        // Scan ticket functionality (marcar usado al escanear)
        async function scanTicket() {
            const qrInput = document.getElementById('qr-input').value.trim();
            
            if (!qrInput) {
                alert('Por favor ingresa el código QR');
                return;
            }
            
            try {
                // Extraer token del contenido QR (JSON) o usar directamente
                let token = qrInput;
                try {
                    const qrData = JSON.parse(qrInput);
                    token = qrData.token || qrData.qrToken || qrInput;
                } catch (e) {
                    // No es JSON; usar la cadena directa como token
                }

                await useToken(token);

                document.getElementById('qr-input').value = '';
            } catch (error) {
                console.error('Error scanning ticket:', error);
                document.getElementById('scan-result').innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 10px;">
                        <h3>❌ Error</h3>
                        <p>Error escaneando el ticket</p>
                    </div>
                `;
            }
        }

        // Camera scanner setup
        let qrScanner = null;
        const videoEl = document.getElementById('qr-video');
        const startBtn = document.getElementById('start-camera-btn');
        const stopBtn = document.getElementById('stop-camera-btn');

        let scanningBusy = false;
        function setupCameraScanner() {
            if (!window.QrScanner) {
                console.error('QrScanner library not loaded');
                return;
            }
            if (qrScanner) return; // already initialized
            qrScanner = new QrScanner(videoEl, result => {
                // result is the decoded string from QR
                try {
                    const raw = (result && typeof result === 'object' && 'data' in result) ? result.data : result;
                    let token = raw;
                    try {
                        const qrData = JSON.parse(raw);
                        token = qrData.token || qrData.qrToken || raw;
                    } catch (_) {}
                    if (scanningBusy) return;
                    scanningBusy = true;
                    useToken(token).finally(() => setTimeout(() => { scanningBusy = false; }, 800));
                } catch (e) {
                    console.error('Error manejando resultado de cámara:', e);
                }
            }, { highlightScanRegion: true, highlightCodeOutline: true });
        }

        startBtn.addEventListener('click', async () => {
            setupCameraScanner();
            try {
                videoEl.style.display = 'block';
                await qrScanner.start();
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
            } catch (e) {
                console.error('No se pudo iniciar la cámara:', e);
                alert('No se pudo iniciar la cámara. Revisa permisos del navegador.');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (qrScanner) qrScanner.stop();
            videoEl.style.display = 'none';
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        });

        // Image file scanning
        const fileInput = document.getElementById('qr-file');
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
                const result = await QrScanner.scanImage(file, { returnDetailedScanResult: true });
                const raw = (result && typeof result === 'object' && 'data' in result) ? result.data : result;
                let token = raw;
                try {
                    const qrData = JSON.parse(raw);
                    token = qrData.token || qrData.qrToken || raw;
                } catch (_) {}
                await verifyToken(token);
            } catch (err) {
                console.error('No se pudo leer el QR de la imagen:', err);
                document.getElementById('scan-result').innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 10px;">
                        <h3>❌ Error</h3>
                        <p>No se pudo leer el QR de la imagen</p>
                    </div>
                `;
            } finally {
                fileInput.value = '';
            }
        });
        
        // Allow Enter key to scan
        document.getElementById('qr-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scanTicket();
            }
        });
        
        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
